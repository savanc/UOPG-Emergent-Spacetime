name: mvp0

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "mvp0/**"
      - "lemma/**"
      - ".github/workflows/mvp0.yml"

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: exact geometry shadow
        run: python3 mvp0/viz/geometry.py --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: build, run, and audit MVP-0
        working-directory: mvp0
        run: |
          cd lean
          lake exe cache get
          cd ..
          chmod +x check.sh
          ./check.sh
      - name: build, run, and audit MVP-1
        run: |
          chmod +x mvp1/check.sh
          ./mvp1/check.sh
      - name: build, run, and audit MVP-2
        run: |
          chmod +x mvp2/check.sh
          ./mvp2/check.sh
      - name: build, run, and audit the rank-one lemma
        run: |
          chmod +x lemma/check.sh
          ./lemma/check.sh
