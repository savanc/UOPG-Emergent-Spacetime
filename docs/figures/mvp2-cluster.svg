<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760">
<rect width="100%" height="100%" fill="#fbf8f3"/>
<rect x="0" y="0" width="960" height="8" rx="0" fill="#1b5e45"/>
<text x="28" y="46" fill="#1a1814" font-size="26" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start" font-weight="700">MVP-2  ·  the orthant factors onto a face</text>
<text x="28" y="72" fill="#5a544a" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">The denominator vanishes on an adjacent wall. The cancellation is algebra, not a cross section.</text>
<rect x="840" y="30" width="92" height="22" rx="11" fill="#1b5e45"/>
<text x="886.0" y="46" fill="#ffffff" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="middle" font-weight="700">PROVED</text>
<rect x="28" y="108" width="448" height="430" rx="12" fill="#e5f2eb" stroke="#1b5e45" stroke-width="1.5"/>
<rect x="492" y="108" width="440" height="430" rx="12" fill="#ffffff" stroke="#1b5e45" stroke-width="1.5"/>
<text x="46" y="142" fill="#1b5e45" font-size="16" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Where the denominator is zero</text>
<text x="46" y="174" fill="#1a1814" font-size="14" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">x y z w = 0  iff  one of them is 0</text>
<text x="46" y="198" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Those four are P01, P12, P03, P23.</text>
<text x="46" y="222" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">P13 = y z + x w is not a factor.</text>
<text x="46" y="258" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">On each face, the other three > 0,</text>
<text x="46" y="280" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">and P13 stays positive.</text>
<text x="46" y="316" fill="#1b5e45" font-size="16" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">witness face x=0:  P13 = 3/4</text>
<text x="46" y="348" fill="#5a544a" font-size="13" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">chart was x=1/2 y=1/2 z=3/2 w=1/2</text>
<text x="46" y="384" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Off the chamber, P13 can vanish</text>
<text x="46" y="406" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">while the product does not:</text>
<text x="46" y="434" fill="#1a1814" font-size="14" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">(1, 1, -1, 1)  product -1</text>
<text x="46" y="470" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">That point is not positive.</text>
<text x="46" y="500" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">No differential form is constructed.</text>
<text x="510" y="142" fill="#1b5e45" font-size="16" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Cancelling one coordinate</text>
<text x="510" y="174" fill="#1a1814" font-size="14" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">x / (x y z w) = 1 / (y z w)</text>
<text x="510" y="198" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">when none of the four is zero.</text>
<text x="510" y="222" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">The right-hand side ignores x.</text>
<text x="510" y="258" fill="#1a1814" font-size="16" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">drop x  =  8/3</text>
<text x="510" y="286" fill="#1a1814" font-size="16" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">drop y  =  8/3</text>
<text x="510" y="314" fill="#1a1814" font-size="16" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">drop z  =  8</text>
<text x="510" y="342" fill="#1a1814" font-size="16" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">drop w  =  8/3</text>
<text x="510" y="380" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Same shape as the 3-orthant</text>
<text x="510" y="402" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">coefficient. Not a residue in</text>
<text x="510" y="424" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">de Rham cohomology, and not</text>
<text x="510" y="446" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">a factorisation of an amplitude.</text>
<text x="510" y="490" fill="#8f2d3a" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">8/3 and 8 are not masses.</text>
<rect x="28" y="556" width="904" height="140" rx="12" fill="#f8e8e8" stroke="#8f2d3a" stroke-width="1.4"/>
<text x="46" y="586" fill="#8f2d3a" font-size="15" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Column shift, one point, not a mutation</text>
<text x="46" y="616" fill="#1a1814" font-size="14" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">column 3  <-  column 3 + 1 * (column 1 + column 2)</text>
<text x="46" y="644" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">At the witness, P23 goes from 1 to 0. Still on the quadric.</text>
<text x="46" y="670" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Proved for this matrix only. A general cluster algebra is not the milestone.</text>
<text x="28" y="732" fill="#5a544a" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">UOPG atlas  ·  proved identities only  ·  python3 mvp0/viz/geometry.py</text>
</svg>
