<text x="424.85714285714283" y="367.4" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">x1</text>
<circle cx="286.0" cy="213.39999999999998" r="5.5" fill="#1b5e45" stroke="#ffffff" stroke-width="1.5"/>
<text x="278.0" y="201.39999999999998" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">x2</text>
