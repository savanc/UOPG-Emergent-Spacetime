<text x="384.9485714285715" y="467.9599999999999" fill="#1b5e45" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">det p0=0</text>
<text x="384.9485714285715" y="254.83999999999997" fill="#1b5e45" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">det p1=0</text>
<text x="165.4857142857143" y="254.83999999999997" fill="#1b5e45" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">det p2=0</text>
<text x="165.4857142857143" y="462.03999999999996" fill="#1b5e45" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">det p3=0</text>
<text x="89.37142857142857" y="161.59999999999997" fill="#5a544a" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">dashed: light lines of x0</text>
<rect x="552" y="108" width="380" height="560" rx="12" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.2"/>
<text x="570" y="138" fill="#1e3a5f" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Reading of the matrices</text>
<text x="570" y="162" fill="#1a1814" font-size="13" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">u = t+x,  v = t-x,  det = u v</text>
<text x="570" y="182" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">so det = t^2 - x^2 on this slice.</text>
<text x="570" y="214" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">x0  (t, x) = (0, 0)</text>
<text x="570" y="234" fill="#5a544a" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">[[0, 0], [0, 0]]</text>
<text x="570" y="266" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">x1  (t, x) = (1, 1)</text>
<text x="570" y="286" fill="#5a544a" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">[[2, 0], [0, 0]]</text>
<text x="570" y="318" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">x2  (t, x) = (2, 0)</text>
<text x="570" y="338" fill="#5a544a" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">[[2, 0], [0, 2]]</text>
<text x="570" y="370" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">x3  (t, x) = (1, -1)</text>
<text x="570" y="390" fill="#5a544a" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">[[0, 0], [0, 2]]</text>
<text x="570" y="430" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Lean edge  p_i = x_i - x_{i+1}</text>
<text x="570" y="452" fill="#1b5e45" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Each det is 0. The sum is 0.</text>
<text x="570" y="482" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Twistors (lambda | mu), exact</text>
<text x="570" y="506" fill="#1a1814" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">Z0  (0,1)  |  (0,0)</text>
<text x="570" y="524" fill="#1a1814" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">Z1  (1,0)  |  (2,0)</text>
<text x="570" y="542" fill="#1a1814" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">Z2  (0,1)  |  (0,2)</text>
<text x="570" y="560" fill="#1a1814" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">Z3  (1,0)  |  (0,0)</text>
<text x="570" y="590" fill="#5a544a" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Angle brackets of consecutive</text>
<text x="570" y="608" fill="#1a1814" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">lambda: 1, -1, 1, -1</text>
<text x="570" y="630" fill="#5a544a" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Loop 0-1-2-3. Lean p_i points the other way.</text>
<text x="28" y="734" fill="#5a544a" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">UOPG atlas  ·  proved identities only  ·  python3 mvp0/viz/geometry.py</text>
</svg>
