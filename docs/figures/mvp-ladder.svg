<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040">
<rect width="100%" height="100%" fill="#fbf8f3"/>
<rect x="0" y="0" width="960" height="8" rx="0" fill="#8a5a12"/>
<text x="28" y="46" fill="#1a1814" font-size="26" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start" font-weight="700">What each rung is</text>
<text x="28" y="72" fill="#5a544a" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">One object, Gr+(2,4). Green is checked in Lean. Amber is the job, not a result.</text>
<rect x="820" y="30" width="112" height="22" rx="11" fill="#8a5a12"/>
<text x="876.0" y="46" fill="#ffffff" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="middle" font-weight="700">CONTRACT</text>
<rect x="820" y="26" width="120" height="30" rx="0" fill="#fbf8f3"/>
<text x="932" y="46" fill="#5a544a" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="end" font-weight="700">atlas</text>
<rect x="72" y="100" width="620" height="152" rx="12" fill="#e5f2eb" stroke="#1b5e45" stroke-width="1.5"/>
<circle cx="44" cy="176" r="8" fill="#1b5e45"/>
<line x1="44" y1="188" x2="44" y2="268" stroke="#d9d3c7" stroke-width="2"/>
<text x="92" y="132" fill="#1b5e45" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">MVP-0</text>
<text x="168" y="132" fill="#1a1814" font-size="18" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start" font-weight="700">The 2-plane is the massless boson</text>
<text x="92" y="168" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">An event is a 2-plane. An edge has det = 0.</text>
<text x="92" y="190" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">The four edges sum to 0.</text>
<text x="92" y="222" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Lean: plucker_relation, pairing_graph, the two edge theorems</text>
<rect x="72" y="268" width="620" height="152" rx="12" fill="#f8f1e3" stroke="#8a5a12" stroke-width="1.5"/>
<circle cx="44" cy="344" r="8" fill="#8a5a12"/>
<line x1="44" y1="356" x2="44" y2="436" stroke="#d9d3c7" stroke-width="2"/>
<text x="92" y="300" fill="#8a5a12" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">MVP-1</text>
<text x="168" y="300" fill="#1a1814" font-size="18" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start" font-weight="700">Canonical form, then Parke-Taylor</text>
<text x="92" y="336" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">In one chart the chamber is an orthant.</text>
<text x="92" y="358" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Its dlog form is not yet the 4-point factor.</text>
<text x="92" y="390" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Not a theorem. No amplitude is derived here.</text>
<rect x="72" y="436" width="620" height="152" rx="12" fill="#f8f1e3" stroke="#8a5a12" stroke-width="1.5"/>
<circle cx="44" cy="512" r="8" fill="#8a5a12"/>
<line x1="44" y1="524" x2="44" y2="604" stroke="#d9d3c7" stroke-width="2"/>
<text x="92" y="468" fill="#8a5a12" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">MVP-2</text>
<text x="168" y="468" fill="#1a1814" font-size="18" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start" font-weight="700">Locality from cluster boundaries</text>
<text x="92" y="504" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Poles should be adjacent minors at zero.</text>
<text x="92" y="526" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Mutation is the Plucker exchange.</text>
<text x="92" y="558" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">The exchange is proved. The locality reading is not.</text>
<rect x="72" y="604" width="620" height="152" rx="12" fill="#f8f1e3" stroke="#8a5a12" stroke-width="1.5"/>
<circle cx="44" cy="680" r="8" fill="#8a5a12"/>
<line x1="44" y1="692" x2="44" y2="772" stroke="#d9d3c7" stroke-width="2"/>
<text x="92" y="636" fill="#8a5a12" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">MVP-3</text>
<text x="168" y="636" fill="#1a1814" font-size="18" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start" font-weight="700">One measured mass in, one ratio out</text>
<text x="92" y="672" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">No GeV inside the conformal geometry.</text>
<text x="92" y="694" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">At most one external mass. The ratio is unknown.</text>
<text x="92" y="726" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">A second scale or a fit voids the milestone.</text>
<rect x="72" y="772" width="620" height="152" rx="12" fill="#f8f1e3" stroke="#8a5a12" stroke-width="1.5"/>
<circle cx="44" cy="848" r="8" fill="#8a5a12"/>
<text x="92" y="804" fill="#8a5a12" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">MVP-4</text>
<text x="168" y="804" fill="#1a1814" font-size="18" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start" font-weight="700">Helicity from the two SL(2)s</text>
<text x="92" y="840" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">det = 0 means the edge has rank one.</text>
<text x="92" y="862" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Helicity would be a little-group weight.</text>
<text x="92" y="894" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">The weight is not derived. No polarisation is claimed.</text>
<rect x="712" y="100" width="220" height="392" rx="12" fill="#f8e8e8" stroke="#8f2d3a" stroke-width="1.5"/>
<text x="724" y="128" fill="#8f2d3a" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Not a theorem</text>
<text x="724" y="162" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Hessian of sum log|det|</text>
<text x="724" y="190" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">that scalar as a metric</text>
<text x="724" y="218" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">the lambda column update</text>
<text x="724" y="246" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">calling that update a mutation</text>
<text x="724" y="274" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">any W, Z, or Higgs mass</text>
<text x="724" y="302" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">sin^2 of the weak angle</text>
<text x="724" y="330" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">a GeV from this geometry</text>
<rect x="712" y="512" width="220" height="150" rx="12" fill="#e8eef5" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="724" y="540" fill="#1e3a5f" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Only comparison</text>
<text x="724" y="572" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Mass from det is 0.</text>
<text x="724" y="596" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Compared, not fitted,</text>
<text x="724" y="620" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">to the PDG photon</text>
<text x="724" y="644" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">bound. See EMPIRICAL.</text>
<text x="28" y="1010" fill="#5a544a" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">UOPG atlas  ·  contract, not a theorem  ·  python3 mvp0/viz/geometry.py</text>
</svg>
