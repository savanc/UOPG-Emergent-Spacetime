<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
<rect width="100%" height="100%" fill="#fbf8f3"/>
<rect x="0" y="0" width="960" height="8" rx="0" fill="#1b5e45"/>
<text x="28" y="46" fill="#1a1814" font-size="26" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start" font-weight="700">MVP-0  ·  one 2-plane, three pictures</text>
<text x="28" y="72" fill="#5a544a" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Same witness as positiveExample in UOPG0.Basic. Numbers below are computed, then checked.</text>
<rect x="840" y="30" width="92" height="22" rx="11" fill="#1b5e45"/>
<text x="886.0" y="46" fill="#ffffff" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="middle" font-weight="700">PROVED</text>
<rect x="28" y="100" width="292" height="500" rx="12" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.4"/>
<text x="46" y="132" fill="#1b5e45" font-size="16" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">2-plane</text>
<rect x="340" y="100" width="292" height="500" rx="12" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.4"/>
<text x="358" y="132" fill="#1b5e45" font-size="16" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Plucker point</text>
<rect x="652" y="100" width="292" height="500" rx="12" fill="#ffffff" stroke="#d9d3c7" stroke-width="1.4"/>
<text x="670" y="132" fill="#1b5e45" font-size="16" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Affine event</text>
<line x1="312" y1="330" x2="338" y2="330" stroke="#1b5e45" stroke-width="1.6"/>
<polygon points="338,330 331.1448899730484,334.1240109745717 331.1448899730484,325.8759890254283" fill="#1b5e45"/>
<line x1="624" y1="330" x2="650" y2="330" stroke="#1b5e45" stroke-width="1.6"/>
<polygon points="650,330 643.1448899730484,334.1240109745717 643.1448899730484,325.8759890254283" fill="#1b5e45"/>
<polygon points="118,250 226,232 262,154 154,172" fill="#e5f2eb" stroke="#1b5e45" stroke-width="1.6"/>
<line x1="118" y1="250" x2="226" y2="232" stroke="#1e3a5f" stroke-width="2.2"/>
<polygon points="226,232 219.15566239382866,237.84423157761128 217.6302001311532,228.6914580015584" fill="#1e3a5f"/>
<line x1="118" y1="250" x2="154" y2="172" stroke="#8f2d3a" stroke-width="2.2"/>
<polygon points="154,172 154.98071262094507,180.94640725403886 146.55573507211827,177.05795607765725" fill="#8f2d3a"/>
<text x="218" y="254" fill="#1e3a5f" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">row 0</text>
<text x="118" y="164" fill="#8f2d3a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">row 1</text>
<text x="46" y="390" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Witness, the Lean point</text>
<text x="46" y="418" fill="#1a1814" font-size="16" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">|  1   1   1   1  |</text>
<text x="46" y="442" fill="#1a1814" font-size="16" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">|  0   1   2   3  |</text>
<text x="46" y="478" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Rows span one plane in k^4.</text>
<text x="46" y="502" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Not a metric. Not a mass.</text>
<text x="46" y="536" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">dim k(n-k) = 4 is why this</text>
<text x="46" y="558" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">can be a spacetime. That</text>
<text x="46" y="580" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">count is not itself a theorem.</text>
<text x="358" y="168" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Six ordered minors</text>
<text x="358" y="200" fill="#1a1814" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">P01  <12></text>
<text x="560" y="200" fill="#1b5e45" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="end">1</text>
<text x="358" y="228" fill="#1a1814" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">P02  <13></text>
<text x="560" y="228" fill="#1b5e45" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="end">2</text>
<text x="358" y="256" fill="#1a1814" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">P03  <14></text>
<text x="560" y="256" fill="#1b5e45" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="end">3</text>
<text x="358" y="284" fill="#1a1814" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">P12  <23></text>
<text x="560" y="284" fill="#1b5e45" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="end">1</text>
<text x="358" y="312" fill="#1a1814" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">P13  <24></text>
<text x="560" y="312" fill="#1b5e45" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="end">2</text>
<text x="358" y="340" fill="#1a1814" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">P23  <34></text>
<text x="560" y="340" fill="#1b5e45" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="end">1</text>
<rect x="358" y="372" width="250" height="78" rx="8" fill="#e5f2eb"/>
<text x="372" y="398" fill="#1a1814" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">P01 P23 - P02 P13 + P03 P12</text>
<text x="372" y="426" fill="#1b5e45" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">= 0    for this point</text>
<text x="358" y="478" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">The same quadratic is 0 for</text>
<text x="358" y="500" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">every 2x4 matrix. That is</text>
<text x="358" y="522" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">plucker_relation, not a fit.</text>
<text x="358" y="556" fill="#1b5e45" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">All six minors are positive.</text>
<text x="358" y="578" fill="#5a544a" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">positiveExample_minors_pos</text>
<text x="670" y="168" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Graph of a 2x2 map x</text>
<text x="670" y="200" fill="#1a1814" font-size="13" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">| 1  0  |  x00  x10 |</text>
<text x="670" y="222" fill="#1a1814" font-size="13" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">| 0  1  |  x01  x11 |</text>
<text x="670" y="258" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Plucker bilinear of two</text>
<text x="670" y="278" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">graphs equals det(x - y).</text>
<rect x="670" y="304" width="250" height="64" rx="8" fill="#e5f2eb"/>
<text x="684" y="330" fill="#1b5e45" font-size="15" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">pairing = 0</text>
<text x="684" y="352" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">exactly when det(x-y) = 0</text>
<text x="670" y="394" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Over a field, det = 0 means</text>
<text x="670" y="416" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">the two events share a</text>
<text x="670" y="438" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">nonzero direction.</text>
<text x="670" y="472" fill="#5a544a" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">nullSeparation_iff</text>
<text x="670" y="492" fill="#5a544a" font-size="12" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">singular_iff_exists_kernel</text>
<text x="670" y="528" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">On a diagonal matrix,</text>
<text x="670" y="550" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">det = u v. Set u = t+x,</text>
<text x="670" y="572" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">v = t-x. Then det = t^2-x^2.</text>
<text x="28" y="692" fill="#5a544a" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">UOPG atlas  ·  proved identities only  ·  python3 mvp0/viz/geometry.py</text>
</svg>
