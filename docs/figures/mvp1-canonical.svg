<text x="530" y="324" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Literature, to be formalised:</text>
<text x="530" y="348" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Arkani-Hamed et al.</text>
<text x="530" y="370" fill="#5a544a" font-size="13" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">arXiv:1212.5605</text>
<text x="530" y="390" fill="#5a544a" font-size="13" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">arXiv:1703.04541</text>
<text x="530" y="424" fill="#1a1814" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">N=4 super Yang-Mills is the</text>
