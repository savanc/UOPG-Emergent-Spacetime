<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
<rect width="100%" height="100%" fill="#fbf8f3"/>
<rect x="0" y="0" width="960" height="8" rx="0" fill="#1b5e45"/>
<text x="28" y="46" fill="#1a1814" font-size="26" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start" font-weight="700">MVP-1  ·  the orthant coefficient</text>
<text x="28" y="72" fill="#5a544a" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Columns 0 and 2 are gauged to the identity. The rational number is proved. A 4-form is not.</text>
<rect x="840" y="30" width="92" height="22" rx="11" fill="#1b5e45"/>
<text x="886.0" y="46" fill="#ffffff" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="middle" font-weight="700">PROVED</text>
<rect x="28" y="108" width="440" height="430" rx="12" fill="#e5f2eb" stroke="#1b5e45" stroke-width="1.5"/>
<text x="46" y="140" fill="#1b5e45" font-size="15" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Chart, all four coordinates positive</text>
<text x="46" y="174" fill="#1a1814" font-size="16" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">x=1/2   y=1/2   z=3/2   w=1/2</text>
<text x="46" y="210" fill="#1a1814" font-size="16" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">|  1   y   0  -w |</text>
<text x="46" y="234" fill="#1a1814" font-size="16" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">|  0   x   1   z |</text>
<text x="46" y="270" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Ordered adjacent product</text>
<text x="46" y="292" fill="#1a1814" font-size="16" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">x y z w  =  3/16</text>
<text x="46" y="328" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Orthant coefficient</text>
<text x="46" y="352" fill="#1b5e45" font-size="18" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">1 / (x y z w)  =  16/3</text>
<text x="46" y="390" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">On the witness this is 16/3.</text>
<text x="46" y="414" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">The algebraic residue is 1.</text>
<text x="46" y="450" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Walls: an adjacent minor is zero.</text>
<text x="46" y="472" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Inside, the other two minors stay positive.</text>
<text x="46" y="506" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">This panel is the chart, not a 4-form.</text>
<rect x="488" y="108" width="444" height="430" rx="12" fill="#ffffff" stroke="#1b5e45" stroke-width="1.5"/>
<text x="506" y="140" fill="#1b5e45" font-size="15" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">Cyclic product, sign included</text>
<text x="506" y="176" fill="#1a1814" font-size="16" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start"><41>  =  - P03</text>
<text x="506" y="208" fill="#1a1814" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">cyclic  =  <12><23><34><41></text>
<text x="506" y="236" fill="#1a1814" font-size="15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="start">       =  - (x y z w)</text>
<text x="506" y="278" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Parke-Taylor coefficient</text>
<text x="506" y="304" fill="#1a1814" font-size="18" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start" font-weight="700">1 / cyclic  =  -16/3</text>
<text x="506" y="340" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Equal to minus the orthant coefficient.</text>
<text x="506" y="372" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">GL(2) multiplies the adjacent</text>
<text x="506" y="394" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">product by (det g)^4.</text>
<text x="506" y="428" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">The gauge that fixes columns</text>
<text x="506" y="450" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">0 and 2 is the unique one.</text>
<text x="506" y="490" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">N=4 super Yang-Mills is the</text>
<text x="506" y="512" fill="#5a544a" font-size="13" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">method copied, not the target.</text>
<text x="28" y="568" fill="#8f2d3a" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Not claimed: a de Rham 4-form, a helicity numerator, a momentum delta,</text>
<text x="28" y="592" fill="#8f2d3a" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">a cross section, or uniqueness of the canonical form in general.</text>
<text x="28" y="628" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Do not read the chart as a plot of a cross section, and do not read 16/3 as a mass.</text>
<text x="28" y="668" fill="#5a544a" font-size="12" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">UOPG atlas  ·  proved identities only  ·  python3 mvp0/viz/geometry.py</text>
</svg>
