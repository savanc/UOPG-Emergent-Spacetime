<text x="28" y="580" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Walls are the adjacent minors. Non-adjacent <13> and <24> stay positive inside</text>
<text x="28" y="604" fill="#1a1814" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">and are tied by the exchange relation. No residue has been computed in Lean.</text>
<text x="28" y="640" fill="#8f2d3a" font-size="14" font-family="DejaVu Sans, Liberation Sans, sans-serif" text-anchor="start">Do not read this square as a plot of a cross section.</text>
